<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Optimizer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f9;
        color: #172026;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(760px, 100%);
        background: #ffffff;
        border: 1px solid #dde5ea;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(20, 34, 45, 0.08);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #5c6b73;
      }

      form {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 650;
      }

      input[type="file"],
      input[type="range"],
      input[type="number"] {
        width: 100%;
      }

      input[type="number"] {
        border: 1px solid #c8d3d9;
        border-radius: 6px;
        font: inherit;
        padding: 10px 12px;
      }

      .drop {
        display: grid;
        gap: 10px;
        padding: 22px;
        border: 1px dashed #8aa1ad;
        border-radius: 8px;
        background: #f9fbfc;
      }

      .quality {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
      }

      .mode {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .mode label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        border: 1px solid #c8d3d9;
        border-radius: 6px;
        padding: 10px 12px;
        font-weight: 700;
      }

      .field {
        display: none;
      }

      .field.active {
        display: grid;
      }

      button,
      a.button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: #1d6f6f;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .preview {
        display: none;
        margin-top: 22px;
        gap: 16px;
        grid-template-columns: 160px 1fr;
        align-items: start;
      }

      .preview img {
        width: 160px;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #dde5ea;
      }

      .result {
        display: none;
        margin-top: 22px;
        padding: 18px;
        border: 1px solid #cce4db;
        border-radius: 8px;
        background: #f2fbf7;
      }

      .result dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 8px 16px;
        margin: 0 0 16px;
      }

      .result dt {
        color: #5c6b73;
      }

      .result dd {
        margin: 0;
        font-weight: 700;
      }

      .error {
        display: none;
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid #f0b8b8;
        border-radius: 8px;
        background: #fff5f5;
        color: #9b1c1c;
      }

      @media (max-width: 620px) {
        main {
          padding: 22px;
        }

        .preview {
          grid-template-columns: 1fr;
        }

        .mode {
          grid-template-columns: 1fr;
        }

        .preview img {
          width: 100%;
          max-height: 260px;
          aspect-ratio: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Media Optimizer</h1>
      <p>Upload a JPG or PNG and download the compressed result.</p>

      <form id="compress-form">
        <label class="drop">
          Image file
          <input id="file" name="file" type="file" accept="image/jpeg,image/png" required />
        </label>

        <div class="mode" role="radiogroup" aria-label="Compression mode">
          <label>
            <input type="radio" name="mode" value="quality" checked />
            Compress by quality
          </label>
          <label>
            <input type="radio" name="mode" value="size" />
            Target file size
          </label>
        </div>

        <label id="quality-field" class="field active">
          Quality
          <span class="quality">
            <input id="quality" name="quality" type="range" min="1" max="100" value="80" />
            <strong id="quality-value">80</strong>
          </span>
        </label>

        <label id="size-field" class="field">
          Target size in KB
          <input id="target-size" name="target-size" type="number" min="1" step="1" value="500" />
        </label>

        <button id="submit" type="submit">Compress image</button>
      </form>

      <section id="preview" class="preview" aria-live="polite">
        <img id="preview-image" alt="Selected image preview" />
        <div>
          <h2 id="preview-name"></h2>
          <p id="preview-size"></p>
        </div>
      </section>

      <section id="result" class="result" aria-live="polite">
        <dl>
          <dt>Original</dt>
          <dd id="original-size"></dd>
          <dt>Compressed</dt>
          <dd id="compressed-size"></dd>
          <dt>Saved</dt>
          <dd id="saved-ratio"></dd>
          <dt>Quality used</dt>
          <dd id="quality-used"></dd>
        </dl>
        <a id="download" class="button" href="#">Download compressed image</a>
      </section>

      <div id="error" class="error" role="alert"></div>
    </main>

    <script>
      const form = document.querySelector("#compress-form");
      const fileInput = document.querySelector("#file");
      const modeInputs = document.querySelectorAll('input[name="mode"]');
      const qualityField = document.querySelector("#quality-field");
      const qualityInput = document.querySelector("#quality");
      const qualityValue = document.querySelector("#quality-value");
      const sizeField = document.querySelector("#size-field");
      const targetSizeInput = document.querySelector("#target-size");
      const submit = document.querySelector("#submit");
      const preview = document.querySelector("#preview");
      const previewImage = document.querySelector("#preview-image");
      const previewName = document.querySelector("#preview-name");
      const previewSize = document.querySelector("#preview-size");
      const result = document.querySelector("#result");
      const errorBox = document.querySelector("#error");

      qualityInput.addEventListener("input", () => {
        qualityValue.textContent = qualityInput.value;
      });

      modeInputs.forEach((input) => {
        input.addEventListener("change", () => {
          const mode = selectedMode();
          qualityField.classList.toggle("active", mode === "quality");
          sizeField.classList.toggle("active", mode === "size");
          clearResult();
        });
      });

      fileInput.addEventListener("change", () => {
        clearResult();
        const file = fileInput.files[0];
        if (!file) {
          preview.style.display = "none";
          return;
        }

        previewImage.src = URL.createObjectURL(file);
        previewName.textContent = file.name;
        previewSize.textContent = formatBytes(file.size);
        preview.style.display = "grid";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearResult();

        const file = fileInput.files[0];
        if (!file) {
          showError("Choose a JPG or PNG first.");
          return;
        }

        const data = new FormData();
        data.append("file", file);
        const params = new URLSearchParams();

        if (selectedMode() === "size") {
          if (!targetSizeInput.value || Number(targetSizeInput.value) <= 0) {
            showError("Enter a target size greater than 0 KB.");
            return;
          }
          params.set("target_size_kb", targetSizeInput.value);
        } else {
          params.set("quality", qualityInput.value);
        }

        submit.disabled = true;
        submit.textContent = "Compressing...";

        try {
          const response = await fetch(`/api/v1/images/compress?${params.toString()}`, {
            method: "POST",
            body: data,
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Compression failed.");
          }

          document.querySelector("#original-size").textContent = formatBytes(payload.original_size);
          document.querySelector("#compressed-size").textContent = formatBytes(payload.compressed_size);
          document.querySelector("#saved-ratio").textContent = `${Math.round(payload.compression_ratio * 100)}%`;
          document.querySelector("#quality-used").textContent = payload.quality_used || "N/A";
          document.querySelector("#download").href = payload.download_url;
          result.style.display = "block";
        } catch (error) {
          showError(error.message);
        } finally {
          submit.disabled = false;
          submit.textContent = "Compress image";
        }
      });

      function clearResult() {
        result.style.display = "none";
        errorBox.style.display = "none";
        errorBox.textContent = "";
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      function selectedMode() {
        return document.querySelector('input[name="mode"]:checked').value;
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes) || bytes <= 0) {
          return "0 B";
        }

        const units = ["B", "KB", "MB", "GB"];
        const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / Math.pow(1024, index);
        return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
      }
    </script>
  </body>
</html>
